name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: SQLite · PHP ${{ matrix.php }} — Tests, Audit & Style
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security audit
        run: composer audit

      - name: Code style check (Pint)
        run: ./vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --stop-on-failure

  hosting:
    name: Hosting · PHP ${{ matrix.php }} · ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4" ]
        server: [ nginx, apache, apache-folder ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, curl, bcmath
          coverage: none
      - name: Install isolated test server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx apache2 mysql-client php${{ matrix.php }}-fpm
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Install locked browser test dependencies
        run: |
          npm ci --prefix tests/Hosting/browser --ignore-scripts --no-audit --no-fund
          tests/Hosting/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real routing, assets, CSRF, storage and private-file protection
        env:
          TEST_WEBSERVER: ${{ matrix.server }}
          TEST_PHP_FPM: /usr/sbin/php-fpm${{ matrix.php }}
          TEST_PHP_CLI: php
          TEST_HTTPD: /usr/sbin/apache2
          TEST_APACHE_MODULES: /usr/lib/apache2/modules
          TEST_APACHE_MIME: /etc/mime.types
          TEST_BROWSER_MODULE: tests/Hosting/browser/node_modules/playwright
          TEST_MYSQL_CONTAINER: '1'
        run: |
          python3 tests/Hosting/verify_nginx.py
          python3 tests/Hosting/verify_mysql_installer.py

  test-mysql:
    name: MySQL 8.0 · PHP ${{ matrix.php }} — Concurrency & Feature Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: upi_gateway_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pcntl, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-mysql-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-mysql-
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify PHP extensions (pdo_mysql, pcntl)
        run: |
          php -m | grep -qi pdo_mysql || { echo "pdo_mysql extension is required but missing"; exit 1; }
          php -m | grep -qi pcntl || { echo "pcntl extension is required but missing"; exit 1; }
          php -r "function_exists('pcntl_fork') || exit(1);" || { echo "pcntl_fork function is unavailable"; exit 1; }

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/' .env
          php artisan key:generate

      - name: Run tests on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: upi_gateway_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --stop-on-failure
